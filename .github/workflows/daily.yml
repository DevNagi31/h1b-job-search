name: Daily job scan

on:
  schedule:
    - cron: "0 13 * * 1-5"   # 09:00 ET weekdays
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The DB carries dedupe state between runs so the digest only shows new roles.
      - name: Restore job database
        uses: actions/cache@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}
          restore-keys: jobs-db-

      - name: Load H1B sponsor data
        run: |
          if [ -f data/sponsors.csv ]; then
            python -m jobsearch.cli load-sponsors data/sponsors.csv
          else
            echo "::warning::data/sponsors.csv absent — sponsor filtering disabled."
          fi

      - name: Run scan
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m jobsearch.cli run \
            ${{ secrets.ANTHROPIC_API_KEY != '' && '--llm' || '' }} \
            --out docs/index.html

      - name: Commit digest
        run: |
          git config user.name  "job-scan-bot"
          git config user.email "job-scan-bot@users.noreply.github.com"
          git add -f docs/index.html docs/index.md
          git diff --staged --quiet || git commit -m "chore: daily job digest $(date -u +%F)"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: job-report
          path: docs/
